name: Meltano Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - .python-version
      - logging/**
      - meltano.yml
      - pyproject.toml
      - pkl/**
      - plugins/**/*
      - transform/models/**/*.sql
      - transform/models/**/*.yml
      - .github/workflows/melty.yaml
      - quarto/**/*.qmd
      - quarto/_quarto.yml
      - quarto/requirements.txt
  push:
    branches: [main]
    paths:
      - .python-version
      - logging/**
      - meltano.yml
      - pyproject.toml
      - pkl/**
      - plugins/**/*
      - transform/models/**/*.sql
      - transform/models/**/*.yml
      - .github/workflows/melty.yaml
      - quarto/**/*.qmd
      - quarto/_quarto.yml
      - quarto/requirements.txt
  workflow_dispatch:
    inputs:
      environment:
        description: Meltano Environment
        required: true
        default: prod
      logConfig:
        description: "Logging configuration file"
        required: true
        default: "logging/dev.yaml"
        type: choice
        options:
          - logging/dev.yaml
  schedule:
    - cron: "0 8 * * *"
      timezone: America/Mexico_City

env:
  DUCKDB_PATH: ${{ secrets.DUCKDB_PATH }}
  FORCE_COLOR: "1"
  HEALTHCHECK_ID: ${{ secrets.HEALTHCHECK_ID }}
  MELTANO_CLI_LOG_CONFIG: "logging/prod.yaml"
  MELTANO_DATABASE_URI: ${{ secrets.MELTANO_DATABASE_URI }}
  MELTANO_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
  MELTANO_RUN_TIMEOUT: 600
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  PYTHONWARNINGS: >
    error,
    once:No GlobalOverrides context is active:UserWarning
  # renovate: datasource=github-tags depName=apple/pkl
  PKL_VERSION: 0.32.1
  # renovate: datasource=npm depName=vercel
  VERCEL_VERSION: 63.1.2
  # renovate: datasource=pypi depName=pip-audit
  PIP_AUDIT_VERSION: 2.10.0

concurrency:
  group: meltano
  cancel-in-progress: true

jobs:
  pkl:
    name: Check stale Pkl output
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pkl
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: ${{ env.PKL_VERSION }}

      - name: Check stale pkl output
        run: pkl eval pkl/main.pkl --format=yaml > meltano.yml

      - name: Check if meltano.yml is different
        run: git diff --exit-code meltano.yml

  audit:
    name: Audit plugin lockfiles
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Audit lockfiles for known vulnerabilities
        run: |
          for f in plugins/requirements/requirements.*.txt; do
            echo "::group::$f"
            uvx "pip-audit==$PIP_AUDIT_VERSION" --no-deps --disable-pip --requirement "$f"
            echo "::endgroup::"
          done

  ping-start:
    name: Ping the start of the pipeline
    runs-on: ubuntu-26.04
    needs: [pkl, audit]
    steps:
      - name: Ping
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Only ping the start of the pipeline if the event is a scheduled run or a push to main
        run: |
          if [ "$EVENT_NAME" == "schedule" ] || [ "$EVENT_NAME" == "push" ]; then
            curl "https://hc-ping.com/$HEALTHCHECK_ID/start"
          fi

  meltano-run:
    name: "Meltano Job: ${{ matrix.job }}"
    runs-on: ubuntu-26.04
    needs: [ping-start]
    continue-on-error: true
    container:
      image: ghcr.io/meltano/meltano:latest-python3.14-slim # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_IO_TOKEN }}
      env:
        TAP_READTHEDOCS_TOKEN: ${{ secrets.TAP_READTHEDOCS_TOKEN }}
        TAP_STACKEXCHANGE_KEY: ${{ secrets.TAP_STACKEXCHANGE_KEY }}
        TARGET_DUCKDB_PATH: ${{ secrets.TARGET_DUCKDB_PATH }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - "pocket-to-duckdb" # Pocket has been phased out :(
          - "stackoverflow-to-duckdb"
          - "rtd-to-duckdb"
          - "gh-to-duckdb"
          - "pypistats-to-duckdb"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Meltano
        run: |
          meltano --version

      - name: Install plugins
        env:
          MELTANO_JOB_NAME: ${{ matrix.job }}
        run: |
          meltano run --only-install "$MELTANO_JOB_NAME"

      - name: Generate MeltyBot token
        if: ${{ matrix.job == 'gh-to-duckdb' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PERSONAL_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PERSONAL_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Run
        env:
          MELTANO_FF_STRICT_ENV_VAR_MODE: true
          MELTANO_JOB_NAME: ${{ matrix.job }}
          TAP_GITHUB_AUTH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          meltano run --no-install "$MELTANO_JOB_NAME"

      - name: Upload Meltano log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meltano-${{ matrix.job }}
          path: logs/meltano.log

  lint:
    name: Lint models
    runs-on: ubuntu-26.04
    continue-on-error: true
    needs: [ping-start]
    container:
      image: ghcr.io/meltano/meltano:latest-python3.14-slim # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_IO_TOKEN }}
      env:
        DUCKDB_PATH: ${{ secrets.DUCKDB_PATH }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Meltano
        run: |
          meltano --version

      - name: Lint
        env:
          MELTANO_CLI_LOG_LEVEL: info
        run: |
          meltano invoke dbt:lint --profiles-dir transform/profiles/duckdb/ --project-dir transform

  transform:
    name: Data Transformation with dbt (DuckDB)
    runs-on: ubuntu-26.04
    needs: [meltano-run, lint]
    container:
      image: ghcr.io/meltano/meltano:latest-python3.14-slim # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_IO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Meltano
        run: |
          meltano --version

      - name: Transform and Test
        run: |
          meltano invoke dbt:build --profiles-dir transform/profiles/duckdb/ --project-dir transform

  build-quarto:
    name: Build Quarto site
    needs: [transform]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: quarto/requirements.txt

      - name: Install Python dependencies
        run: |
          uv venv quarto/.venv
          uv pip install --python quarto/.venv/bin/python -r quarto/requirements.txt

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Render Quarto site
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/quarto/.venv/bin/python
        run: |
          quarto render quarto

      - name: Upload Quarto build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarto-build
          path: quarto/_site

  deploy-quarto:
    name: Deploy Quarto site
    needs: [build-quarto]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # Update the PR with the Vercel preview URL if this is a PR run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Git config
        run: |
          git config --global --add safe.directory /__w/meltano-dogfood/meltano-dogfood

      - name: Download Quarto build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarto-build
          path: quarto/_site

      - name: Deploy
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          github-comment: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-project-name: Meltano Dogfood Project
          vercel-args: ${{ case(github.event_name == 'pull_request', '', '--prod') }}
          vercel-version: ${{ env.VERCEL_VERSION }}

  ping-end:
    name: Ping the end of the pipeline
    runs-on: ubuntu-26.04
    needs: [deploy-quarto]
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Ping
        run: |
          curl "https://hc-ping.com/$HEALTHCHECK_ID"
