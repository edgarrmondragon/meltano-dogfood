default_environment: dev
project_id: b77cad0a-ffd8-494e-9e6b-18d6eacb71d4
project_readonly: true
requires_meltano: '>=4.4'
venv:
  backend: uv
ff:
  plugin_locks_required: true
plugins:
  extractors:
  - name: tap-stackexchange
    variant: meltanolabs
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.tap-stackexchange.txt
    config:
      tags:
      - meltano
    select:
    - questions.*
  - name: tap-readthedocs
    variant: reservoir-data
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.tap-readthedocs.txt
    select:
    - projects.*
  - name: tap-github
    variant: meltanolabs
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.tap-github.txt
    config:
      organizations:
      - reservoir-data
      start_date: 1 month ago
      user_agent: $MELTANO_USER_AGENT
    select:
    - repositories.*
  - name: tap-pypistats
    variant: reservoir-data
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.tap-pypistats.txt
    config:
      packages:
      - meltano
      - singer-sdk
      - singer-python
      - target-hotglue
      - pipelinewise-singer-python
      - dlt
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.target-jsonl.txt
    config:
      destination_path: output/$MELTANO_EXTRACTOR_NAMESPACE
  - name: target-ducklake
    namespace: target_ducklake
    executable: target-ducklake
    capabilities:
    - about
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.target-ducklake.txt
    settings:
    - kind: string
      name: catalog
      sensitive: true
    - kind: string
      name: data_path
    - kind: string
      name: default_target_schema
    - kind: boolean
      name: run_maintenance
    - kind: string
      name: s3_endpoint
    - kind: string
      name: s3_region
    - kind: string
      name: s3_url_style
    - kind: string
      name: s3_access_key_id
      sensitive: true
    - kind: string
      name: s3_secret_access_key
      sensitive: true
    config:
      catalog: postgres:$NEON_DATABASE_URL
      data_path: s3://ducklake/warehouse/
      default_target_schema: $MELTANO_EXTRACT__LOAD_SCHEMA
      s3_endpoint: $AWS_ENDPOINT_URL_S3
      s3_region: $AWS_REGION
      s3_url_style: path
      s3_access_key_id: $AWS_ACCESS_KEY_ID
      s3_secret_access_key: $AWS_SECRET_ACCESS_KEY
  utilities:
  - name: dbt
    namespace: dbt
    variant: dbt-labs
    pip_url: -r $MELTANO_PROJECT_ROOT/plugins/requirements/requirements.dbt.txt
    commands:
      lint:
        args: lint
        description: Lint SQL files
      build:
        args: build
        description: Will run your models, tests, snapshots and seeds in DAG order
environments:
- name: dev
- name: staging
- name: prod
  env:
    MELTANO_FF_PLUGIN_LOCKS_REQUIRED: 'true'
    MELTANO_FF_STRICT_ENV_VAR_MODE: 'true'
jobs:
- name: stackoverflow-to-duckdb
  tasks:
  - tap-stackexchange target-ducklake
- name: rtd-to-duckdb
  tasks:
  - tap-readthedocs target-ducklake
- name: gh-to-duckdb
  tasks:
  - tap-github target-ducklake
- name: pypistats-to-duckdb
  tasks:
  - tap-pypistats target-ducklake
